# Run-05 — scattered random sensors via stations file, β-space state.
filter:
  nprt: 1000
  verbose: true
  output_filename: "glacier-code/particleda/results/run05_random_scattered_16obs/particle_da.h5"
  seed: 42

model:
  glacier:
    nx: 40
    ny: 40
    x_length: 160000.0
    y_length: 160000.0
    station_filename: "glacier-code/particleda/stations_random_16.txt"
    init_std_beta: 300.0
    process_std_beta: 7.0
    obs_noise_std: 0.10
    advection_epsilon: 0.0005
    n_integration_step: 10
    time_step: 3600.0
    min_beta: 10.0
    noise_length_scale: 30000.0

simulate_observations:
  seed: 123
  n_time_step: 200
